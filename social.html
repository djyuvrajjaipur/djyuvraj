<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DJ YUVRAJ | Official Links</title>

  <meta name="description" content="Official social media links of DJ YUVRAJ Jaipur" />

  <!-- Font Awesome Icons -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  />

  <!-- Google Font -->
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #000000, #111111, #1a1a1a);
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 450px;
      text-align: center;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 25px;
      padding: 40px 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .profile-img {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #ffcc00;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 8px;
      letter-spacing: 2px;
    }

    p {
      color: #ccc;
      margin-bottom: 30px;
      font-size: 15px;
    }

    .social-links {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .social-links a {
      text-decoration: none;
      color: white;
      background: #1f1f1f;
      padding: 16px;
      border-radius: 14px;
      font-size: 18px;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition: 0.3s ease;
      border: 1px solid rgba(255,255,255,0.08);
    }

    .social-links a:hover {
      transform: translateY(-3px);
      background: #ffcc00;
      color: black;
    }

    .social-links i {
      font-size: 22px;
    }

    .footer {
      margin-top: 30px;
      color: #888;
      font-size: 13px;
    }

    @media (max-width: 500px) {
      h1 {
        font-size: 26px;
      }

      .social-links a {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- YOUR IMAGE -->
    <img
      src="your-photo.jpg"
      alt="DJ YUVRAJ"
      class="profile-img"
    />

    <h1>DJ YUVRAJ</h1>

    <p>Professional DJ | Weddings • Clubs • Corporate Events</p>

    <div class="social-links">

      <!-- Instagram -->
      <a href="https://instagram.com/djyuvraj" target="_blank">
        <i class="fab fa-instagram"></i>
        @djyuvraj
      </a>

      <!-- YouTube -->
      <a href="https://youtube.com/@djyuvraj" target="_blank">
        <i class="fab fa-youtube"></i>
        @djyuvraj
      </a>

      <!-- Facebook -->
      <a href="https://facebook.com/djyuvraj" target="_blank">
        <i class="fab fa-facebook"></i>
        DJ YUVRAJ
      </a>

      <!-- SoundCloud -->
      <a href="https://soundcloud.com/djyuvraj" target="_blank">
        <i class="fab fa-soundcloud"></i>
        DJ YUVRAJ
      </a>

      <!-- Spotify -->
      <a href="https://open.spotify.com/" target="_blank">
        <i class="fab fa-spotify"></i>
        Spotify
      </a>

      <!-- LinkedIn -->
      <a href="https://linkedin.com/in/djyuvraj" target="_blank">
        <i class="fab fa-linkedin"></i>
        DJ YUVRAJ
      </a>

      <!-- Website -->
      <a href="https://djyuvraj.in" target="_blank">
        <i class="fas fa-globe"></i>
        djyuvraj.in
      </a>

      <!-- WhatsApp -->
      <a href="https://wa.me/919999999999" target="_blank">
        <i class="fab fa-whatsapp"></i>
        WhatsApp
      </a>

    </div>

    <div class="footer">
      © 2026 DJ YUVRAJ • All Rights Reserved
    </div>

  </div>

</body>
</html>
