<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>DJ YUVRAJ | Official Social Links</title>

  <meta
    name="description"
    content="Official social media and music links of DJ YUVRAJ Jaipur"
  />

  <!-- Fonts -->
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <!-- Font Awesome -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  />

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:'Poppins',sans-serif;
      background:linear-gradient(135deg,#000000,#111111,#1c1c1c);
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:20px;
      color:white;
    }

    .container{
      width:100%;
      max-width:450px;
      background:rgba(255,255,255,0.05);
      backdrop-filter:blur(12px);
      border:1px solid rgba(255,255,255,0.08);
      border-radius:28px;
      padding:40px 25px;
      text-align:center;
      box-shadow:0 10px 30px rgba(0,0,0,0.5);
    }

    .profile-img{
      width:130px;
      height:130px;
      border-radius:50%;
      object-fit:cover;
      border:4px solid #ffcc00;
      margin-bottom:18px;
    }

    h1{
      font-size:32px;
      letter-spacing:2px;
      margin-bottom:8px;
    }

    .tagline{
      color:#cccccc;
      font-size:14px;
      margin-bottom:30px;
    }

    .links{
      display:flex;
      flex-direction:column;
      gap:14px;
    }

    .links a{
      text-decoration:none;
      color:white;
      background:#1a1a1a;
      padding:16px;
      border-radius:14px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:12px;
      font-size:17px;
      font-weight:500;
      transition:0.3s ease;
      border:1px solid rgba(255,255,255,0.06);
    }

    .links a:hover{
      background:#ffcc00;
      color:black;
      transform:translateY(-3px);
    }

    .links i{
      font-size:22px;
    }

    .footer{
      margin-top:30px;
      color:#888;
      font-size:13px;
    }

    @media(max-width:500px){
      h1{
        font-size:26px;
      }

      .links a{
        font-size:15px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- YOUR IMAGE -->
    <img src="https://djyuvraj.in/FrontImage.jpeg" alt="DJ YUVRAJ" class="profile-img">

        <i class="fab fa-youtube"></i>

        <i class="fas fa-headphones"></i>

      </a>

      <a href="https://soundcloud.com/djyuvrajjaipur" target="_blank">
        <i class="fab fa-soundcloud"></i>

      </a>

        <i class="fab fa-bandcamp"></i>

      </a>

      <a href="https://linkedin.com/in/djyuvraj" target="_blank">
        <i class="fab fa-linkedin"></i>

      <a href="https://www.wedmegood.com/profile/DJ-Yuvraj-Jaipur-24262332" target="_blank">
        <i class="fas fa-ring"></i>

      </a>

      <a href="https://t.me/djyuvraj" target="_blank">
        <i class="fab fa-telegram"></i>
        Telegram
      </a>

      <a href="https://wa.me/+919928013885" target="_blank">
        <i class="fab fa-whatsapp"></i>
        WhatsApp

      <a href="https://djyuvraj.blogspot.com" target="_blank">
        <i class="fab fa-blogger"></i>
        Blogspot
      </a>

    </div>

    <div class="footer">
      © 2026 DJ YUVRAJ • Jaipur, India
    </div>

  </div>

</body>
</html>
